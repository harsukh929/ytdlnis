name: Build MediaFetch APK

on:
  workflow_dispatch:
  push:
    branches:
      - chatgpt/mediafetch-browser

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs
        run: |
          chmod +x ./gradlew
          # The Google Maps secrets Gradle plugin expects this file to exist in CI.
          touch local.properties
          ./gradlew :app:assembleGithubDebug --stacktrace
      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MediaFetch-debug-apks
          path: app/build/outputs/apk/github/debug/*.apk
          if-no-files-found: error
          retention-days: 14
